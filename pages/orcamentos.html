<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Solicitar Orçamento | Space Metal</title>
</head>
<body>
    <header>
        <h1>Solicitação de Orçamento</h1>
        <nav>
            <a href="../index.html">Início</a> |
            <a href="produtos.html">Produtos</a> |
            <a href="orcamentos.html">Orçamentos</a>
        </nav>
    </header>
    <hr>

    <main>
        <h2>Peça uma Cotação Sob Medida</h2>
        <form>
            <fieldset>
                <legend>Dados de Contacto</legend>
                <p>
                    <label for="nome">Nome Completo:</label><br>
                    <input type="text" id="nome" name="nome" required>
                </p>
                <p>
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="telefone">Telefone/WhatsApp:</label><br>
                    <input type="tel" id="telefone" name="telefone" required>
                </p>
            </fieldset>

            <fieldset>
                <legend>Detalhes do Projeto</legend>
                <p>
                    <label for="tipoProjeto">Tipo de Serviço:</label><br>
                    <select id="tipoProjeto" name="tipoProjeto">
                        <option value="portao">Portão Automático</option>
                        <option value="grade">Grades de Segurança</option>
                        <option value="mezanino">Mezanino / Estrutura Metálica</option>
                        <option value="cobertura">Cobertura / Telhado</option>
                        <option value="personalizado" selected>Serviço Personalizado / Outro</option>
                    </select>
                </p>
                <p>
                    <label for="medidas">Medidas Aproximadas (Largura x Altura em metros):</label><br>
                    <input type="text" id="medidas" name="medidas" placeholder="Ex: 3.00m x 2.20m">
                </p>
                <p>
                    <label for="descricao">Especifique o que deseja (Serviço Personalizado):</label><br>
                    <textarea id="descricao" name="descricao" rows="5" cols="40" placeholder="Descreva em detalhes o seu projeto sob medida..."></textarea>
                </p>
            </fieldset>
            <br>
            <button type="submit">Enviar Solicitação</button>
        </form>
    </main>
</body>
</html>
