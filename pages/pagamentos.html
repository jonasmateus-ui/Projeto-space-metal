<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pagamentos e Faturamento | Space Metal</title>
</head>
<body>
    <header>
        <h1>Pagamento de Sinal e Parcelas</h1>
        <nav>
            <a href="../index.html">Início</a> |
            <a href="contratos.html">Contratos</a> |
            <a href="pagamentos.html">Pagamentos</a>
        </nav>
    </header>
    <hr>

    <main>
        <h2>Registo de Pagamento</h2>
        <form>
            <p>
                <label for="contratoRef">Número do Contrato:</label><br>
                <input type="text" id="contratoRef" name="contratoRef" placeholder="Ex: CT-2026-89" required>
            </p>
            <p>
                <label for="tipoPagamento">Tipo de Pagamento:</label><br>
                <select id="tipoPagamento" name="tipoPagamento">
                    <option value="sinal">Sinal (30% para início da produção)</option>
                    <option value="parcela">Parcela Intermediária / Final</option>
                </select>
            </p>
            <p>
                <label for="forma">Forma de Pagamento:</label><br>
                <select id="forma" name="forma">
                    <option value="pix">PIX</option>
                    <option value="ted">Transferência (TED/DOC)</option>
                    <option value="cartao">Cartão de Crédito</option>
                </select>
            </p>
            <p>
                <label for="comprovativo">Anexar Comprovativo (Simulação):</label><br>
                <input type="file" id="comprovativo" name="comprovativo">
            </p>
            <button type="submit">Enviar Comprovativo</button>
        </form>
    </main>
</body>
</html>
