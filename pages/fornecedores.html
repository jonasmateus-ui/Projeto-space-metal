<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gestao de Fornecedores - Space Metal</title>
</head>
<body>
    <h1>Gestao de Fornecedores</h1>
    <p><a href="../index.html">Voltar ao Inicio</a></p>

    <h2>Cadastrar Fornecedor</h2>
    <form action="#" method="post">
        <p>
            <label for="id_fornecedor">ID Fornecedor:</label><br>
            <input type="text" id="id_fornecedor" name="id_fornecedor" required>
        </p>
        <p>
            <label for="nome">Razao Social:</label><br>
            <input type="text" id="nome" name="nome" required>
        </p>
        <p>
            <label for="cnpj">CNPJ:</label><br>
            <input type="text" id="cnpj" name="cnpj" required>
        </p>
        <p>
            <label for="telefone">Telefone:</label><br>
            <input type="text" id="telefone" name="telefone">
        </p>
        <p>
            <label for="tipo_material">Tipo de Material Fornecido:</label><br>
            <input type="text" id="tipo_material" name="tipo_material">
        </p>
        <p>
            <input type="submit" value="Salvar Fornecedor">
        </p>
    </form>

    <hr>

    <h2>Fornecedores Cadastrados</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Razao Social</th>
                <th>CNPJ</th>
                <th>Telefone</th>
                <th>Materiais</th>
                <th>Acoes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>FORN-001</td>
                <td>Gerdau Comercial de Acos S.A.</td>
                <td>00.000.000/0001-91</td>
                <td>(11) 4002-8922</td>
                <td>Perfis estruturais, Tubos, Chapas</td>
                <td><a href="estoque.html">Vincular ao Estoque</a></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
