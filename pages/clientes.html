<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Área do Cliente | Space Metal</title>
</head>
<body>
    <header>
        <h1>Área do Cliente</h1>
        <nav>
            <a href="../index.html">Início</a> |
            <a href="clientes.html">Meus Dados</a> |
            <a href="contratos.html">Meus Contratos</a> |
            <a href="pagamentos.html">Pagamentos</a>
        </nav>
    </header>
    <hr>

    <main>
        <h2>Cadastro / Atualização de Dados do Cliente</h2>
        <form>
            <p>
                <label for="cpf_cnpj">CPF ou CNPJ:</label><br>
                <input type="text" id="cpf_cnpj" name="cpf_cnpj" required>
            </p>
            <p>
                <label for="nome_cliente">Nome ou Razão Social:</label><br>
                <input type="text" id="nome_cliente" name="nome_cliente" required>
            </p>
            <p>
                <label for="endereco">Endereço de Obra/Instalação:</label><br>
                <input type="text" id="endereco" name="endereco" required>
            </p>
            <button type="submit">Salvar Dados</button>
        </form>
    </main>
</body>
</html>
