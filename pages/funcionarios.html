<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gestao de Funcionarios - Space Metal</title>
</head>
<body>
    <h1>Gestao de Funcionarios</h1>
    <p><a href="../index.html">Voltar ao Inicio</a></p>

    <h2>Cadastrar Funcionario</h2>
    <form action="#" method="post">
        <p>
            <label for="id_funcionario">ID do Funcionario:</label><br>
            <input type="text" id="id_funcionario" name="id_funcionario" required>
        </p>
        <p>
            <label for="nome">Nome Completo:</label><br>
            <input type="text" id="nome" name="nome" required>
        </p>
        <p>
            <label for="cpf">CPF:</label><br>
            <input type="text" id="cpf" name="cpf" required>
        </p>
        <p>
            <label for="cargo">Cargo:</label><br>
            <select id="cargo" name="cargo">
                <option value="CEO">CEO</option>
                <option value="Vendedora">Vendedora</option>
                <option value="Serralheiro">Serralheiro</option>
                <option value="Soldador">Soldador</option>
                <option value="Ajudante / Instalador">Ajudante / Instalador</option>
            </select>
        </p>
        <p>
            <input type="submit" value="Salvar Funcionario">
        </p>
    </form>

    <hr>

    <h2>Funcionarios Cadastrados</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome Completo</th>
                <th>CPF</th>
                <th>Cargo</th>
                <th>Acoes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>FUNC-001</td>

            </tr>
            <tr>
                <td>FUNC-002</td>
                <td>Mariana Souza</td>

                <td>Vendedora</td>
                <td><a href="orcamentos.html">Ver Orcamentos Criados</a></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
